name: Update static map data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-map-data
  cancel-in-progress: false

jobs:
  update-map-data:
    name: Update routes and geometries
    runs-on: ubuntu-latest
    steps:
      - name: Download the repository
        uses: actions/checkout@v7

      - name: Python setup
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Static data generation and verification
        run: python scripts/update-map-data.py

      - name: Commit changes to GitHub
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- data/transport-map.json; then
            echo "There are no changes in data/transport-map.json. There is nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/transport-map.json
          git commit -m "Update static map data"
          git push origin "HEAD:${TARGET_BRANCH}"
